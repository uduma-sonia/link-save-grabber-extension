<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Saver</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #ffffff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      main {
        width: 450px;
        padding: 10px;
        border: 1px solid #000000;
        border-radius: 10px;
      }

      .url_input {
        width: 100%;
        height: 45px;
        border: 1.5px solid #5a5858;
        border-radius: 10px;
        padding: 0px 10px;
        font-size: 14px;
        font-weight: 500;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #000000;
        outline: none;
      }

      .btns_container {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
      }

      .btns_container > button {
        height: 40px;
        background-color: #6a36ad;
        color: white;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 14px;
        border-radius: 10px;
        width: 100%;
        font-weight: 500;
        border: none;
        cursor: pointer;
        outline: none;
        margin-bottom: 10px;
      }

      ul {
        padding: 0px 8px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-top: 10px;
      }

      ul li {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }

      li a {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 14px;
        font-weight: 500;
        color: #000000;
      }
      li a:hover {
        color: #195a01;
      }

      li div {
        white-space: pre-wrap;
        word-wrap: break-word;
        overflow: hidden;
      }

      li button {
        background-color: #f1f1f1;
        color: #e00202;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid white;
        font-weight: 600;
        cursor: pointer;
        outline: none;
        border: 1px solid black;
        border-radius: 8px;
        min-width: 27px;
        height: 27px;
        font-size: 12px;
      }

      li button:hover {
        background-color: #e00202;
        color: #ffffff;
      }
    </style>
  </head>

  <body>
    <main>
      <input
        type="url"
        class="url_input"
        id="linkInput"
        placeholder="Enter link"
      />
      <div class="btns_container">
        <button id="addBtn">Add Link</button>
        <button id="saveCurrentTabBtn">Save Current Tab</button>
      </div>

      <ul id="linkList"></ul>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
